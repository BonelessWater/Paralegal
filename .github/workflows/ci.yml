name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend Python tests
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov pytest-asyncio flake8 black mypy

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check backend/

    - name: Type check with mypy
      run: |
        mypy backend/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true  # Don't fail on type errors initially

    - name: Run backend tests
      run: |
        pytest backend/ -v --cov=backend --cov-report=xml --cov-report=term
      continue-on-error: true  # Don't fail if tests don't exist yet

  # Frontend TypeScript tests
  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Lint TypeScript
      working-directory: frontend
      run: npm run lint

    - name: Type check
      working-directory: frontend
      run: npx tsc --noEmit

    - name: Build frontend
      working-directory: frontend
      run: npm run build

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Dependency audit
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install safety
      run: pip install safety

    - name: Check Python dependencies for vulnerabilities
      run: safety check --file=requirements.txt --file=backend/requirements.txt
      continue-on-error: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Audit npm dependencies
      working-directory: frontend
      run: npm audit --audit-level=high
      continue-on-error: true

  # Build status check
  build-status:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan, dependency-audit]
    if: always()
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.backend-test.result }}" = "success" ] && \
           [ "${{ needs.frontend-test.result }}" = "success" ]; then
          echo "All checks passed!"
          exit 0
        else
          echo "Some checks failed"
          exit 1
        fi
