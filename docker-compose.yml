version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: paralegal-db
    environment:
      POSTGRES_DB: ${DB_NAME:-paralegal_db}
      POSTGRES_USER: ${DB_USER:-paralegal_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./AMD_server/scraper/database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./AMD_server/scraper/case_management_schema.sql:/docker-entrypoint-initdb.d/02-case-management.sql
      - ./AMD_server/scraper/client_communications_schema.sql:/docker-entrypoint-initdb.d/03-communications.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paralegal_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paralegal-network

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paralegal-backend
    environment:
      # Server config
      HOST: 0.0.0.0
      PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-False}

      # vLLM config
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://localhost:8000}

      # Database config
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-paralegal_db}
      DB_USER: ${DB_USER:-paralegal_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}

      # API keys (from .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      COURTLISTENER_API_TOKEN: ${COURTLISTENER_API_TOKEN}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - paralegal-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: paralegal-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - paralegal-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  paralegal-network:
    driver: bridge
